<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>auraliscare — Project Report</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 11pt; }
body {
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
  color: #111827;
  background: #fff;
  line-height: 1.58;
}
.page {
  width: 210mm;
  min-height: 297mm;
  padding: 16mm 18mm 20mm 18mm;
  margin: 0 auto;
  page-break-after: always;
  position: relative;
  overflow: hidden;
}
.page:last-child { page-break-after: avoid; }
@media print {
  body { margin: 0; }
  .page { margin: 0; width: 210mm; }
}
@media screen {
  body { background: #e5e7eb; }
  .page { margin: 10mm auto; box-shadow: 0 4px 24px rgba(0,0,0,.18); background: #fff; }
}

/* ── COVER ── */
.cover {
  background: linear-gradient(150deg, #0b0e2e 0%, #1e1b4b 45%, #0c1840 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 0;
  padding: 0 20mm;
}
.cover-badge {
  font-size: 8.5pt; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  color: #a5b4fc; border: 1px solid #4338ca; padding: 4px 16px; border-radius: 20px;
  margin-bottom: 24px;
}
.cover h1 {
  font-size: 46pt; font-weight: 900; letter-spacing: -.04em; line-height: 1;
  margin-bottom: 4px;
}
.cover h1 span { color: #818cf8; }
.cover-tagline { font-size: 12pt; color: #a5b4fc; font-weight: 500; margin-bottom: 28px; }
.cover-hr { width: 72px; height: 3px; background: linear-gradient(90deg,#6366f1,#06b6d4); border-radius: 2px; margin: 0 auto 26px; }
.cover-meta { font-size: 10pt; color: #94a3b8; line-height: 2.1; }
.cover-meta strong { color: #e2e8f0; }
.cover-stats { display: flex; gap: 32px; margin-top: 32px; justify-content: center; }
.cs { text-align: center; }
.cs-n { font-size: 28pt; font-weight: 900; line-height: 1; }
.cs-l { font-size: 7.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #94a3b8; margin-top: 2px; }

/* ── INNER PAGES ── */
.ph { display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1.5px solid #e0e7ff; padding-bottom: 7px; margin-bottom: 16px;
      font-size: 8pt; color: #94a3b8; font-weight: 600; }
.ph .brand { color: #6366f1; font-weight: 800; font-size: 8.5pt; }
.pf { position: absolute; bottom: 10mm; left: 18mm; right: 18mm;
      border-top: 1px solid #e0e7ff; padding-top: 5px;
      display: flex; justify-content: space-between; font-size: 7.5pt; color: #aaa; }

h2 { font-size: 14.5pt; font-weight: 800; color: #1e1b4b; letter-spacing: -.02em;
     margin: 20px 0 9px; padding-bottom: 5px; border-bottom: 2.5px solid #6366f1; }
h3 { font-size: 11.5pt; font-weight: 700; color: #312e81; margin: 15px 0 5px; }
h4 { font-size: 10pt; font-weight: 700; color: #6366f1; text-transform: uppercase;
     letter-spacing: .07em; margin: 11px 0 4px; }
p  { margin-bottom: 8px; font-size: 10.5pt; }
ul, ol { padding-left: 18px; margin-bottom: 9px; font-size: 10.5pt; }
li { margin-bottom: 3px; }
strong { color: #1e1b4b; }

.sn { display: inline-block; background: #6366f1; color: #fff; font-size: 7.5pt;
      font-weight: 800; padding: 1px 9px; border-radius: 10px; margin-right: 7px; vertical-align: middle; }

/* boxes */
.box { border-radius: 9px; padding: 10px 14px; margin: 10px 0; }
.box-blue { background: #eef2ff; border: 1.5px solid #c7d2fe; }
.box-warn { background: #fffbeb; border: 1.5px solid #fcd34d; }
.box-green { background: #f0fdf4; border: 1.5px solid #86efac; }
.box-red  { background: #fff1f2; border: 1.5px solid #fca5a5; }
.bt { font-size: 8.5pt; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
      margin-bottom: 4px; color: #4338ca; }
.box-warn .bt { color: #b45309; }
.box-green .bt { color: #15803d; }
.box-red .bt { color: #be123c; }

/* tables */
table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 9.5pt; }
thead tr { background: #1e1b4b; color: #fff; }
th { padding: 7px 10px; text-align: left; font-size: 9pt; font-weight: 700; }
tbody tr:nth-child(even) { background: #f5f3ff; }
td { padding: 6px 10px; border-bottom: 1px solid #e0e7ff; vertical-align: top; }

/* figures */
.fig { border: 1.5px solid #e0e7ff; border-radius: 9px; padding: 14px;
       margin: 14px 0; background: #fafafe; }
.fc { font-size: 8.5pt; color: #64748b; font-style: italic; text-align: center; margin-top: 7px; }

/* flow */
.flow { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0; }
.fb { background: #6366f1; color: #fff; border-radius: 7px; padding: 7px 11px;
      font-size: 8pt; font-weight: 700; text-align: center; min-width: 72px; line-height: 1.35; }
.fb.b { background: #0ea5e9; }
.fb.g { background: #10b981; }
.fb.a { background: #f59e0b; color: #1a1a2e; }
.fb.r { background: #ef4444; }
.fa { font-size: 13pt; color: #9ca3af; padding: 0 4px; }

/* metrics */
.metrics { display: flex; gap: 10px; margin: 12px 0; }
.mc { flex: 1; border: 1.5px solid #c7d2fe; border-radius: 9px; padding: 10px 6px;
      text-align: center; background: #eef2ff; }
.mv { font-size: 21pt; font-weight: 900; color: #6366f1; line-height: 1; }
.mv.c { color: #0ea5e9; } .mv.g { color: #10b981; } .mv.a { color: #f59e0b; }
.ml { font-size: 7.5pt; color: #6b7280; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; margin-top: 3px; }

/* score bars */
.sb { margin: 5px 0 10px; }
.sb-lbl { font-size: 9pt; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 3px; }
.sb-bg { height: 8px; background: #e0e7ff; border-radius: 4px; overflow: hidden; }
.sb-fill { height: 100%; border-radius: 4px; }

/* two/three col */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 10px 0; }

/* chips */
.chip { display: inline-block; background: #eef2ff; color: #4338ca; font-size: 7.5pt;
        font-weight: 700; padding: 2px 8px; border-radius: 9px; margin: 2px 2px; }
.chip.g { background: #dcfce7; color: #166534; }
.chip.a { background: #fef9c3; color: #854d0e; }
.chip.r { background: #fee2e2; color: #991b1b; }

code { font-family: 'JetBrains Mono', monospace; font-size: 9pt;
       background: #f0f0ff; padding: 1px 5px; border-radius: 4px; color: #4338ca; }
</style>
</head>
<body>
